<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio — Meredith Liu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { headline: ['Newsreader'], body: ['Manrope'], mono: ['DM Mono'] },
  colors: { sand:'#F7F5F0', sand2:'#EFEDE8', ink:'#1A1A1A', muted:'#6B6660', dim:'#A8A4A0', warm:'#8C6D3F', blue:'#2C5F8A' }
} } }
</script>
<style>
  .grain-overlay { position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .dot { width:6px; height:6px; border-radius:50%; background:#C4A97A; display:inline-block; animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
  .masonry { columns: 1; column-gap: 16px; }
  @media (min-width: 560px) { .masonry { columns: 2; } }
  @media (min-width: 900px) { .masonry { columns: 3; } }
  .masonry-item { break-inside: avoid; margin-bottom: 24px; cursor: zoom-in; }
  .masonry-item img { transition: opacity .25s, transform .6s cubic-bezier(.23,1,.32,1); }
  .masonry-item:hover img { opacity: .92; transform: scale(1.015); }
  .filter-btn { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; padding:6px 14px;
    border:1px solid rgba(0,0,0,.1); color:#A8A4A0; background:transparent; cursor:pointer; transition:all .2s; }
  .filter-btn:hover { color:#1A1A1A; border-color:rgba(0,0,0,.2); }
  .filter-btn.on { color:#8C6D3F; border-color:rgba(140,109,63,.4); background:rgba(140,109,63,.06); }
  .hidden-item { display:none; }
  #lightbox { display:none; position:fixed; inset:0; z-index:1000; background:rgba(10,10,10,.92); align-items:center; justify-content:center; padding:40px; flex-direction:column; }
  #lightbox.open { display:flex; }
  #lb-img { max-width:min(1000px,92vw); max-height:80vh; object-fit:contain; }
  #lb-close { position:absolute; top:24px; right:32px; font-size:20px; color:rgba(255,255,255,.5); background:none; border:none; cursor:pointer; }
  #lb-close:hover { color:#fff; }
  .lb-nav { position:absolute; top:50%; transform:translateY(-50%); font-size:28px; color:rgba(255,255,255,.4); background:none; border:none; cursor:pointer; padding:20px; }
  .lb-nav:hover { color:#fff; }
</style>
</head>
<body class="bg-sand text-ink font-body">
<div class="grain-overlay"></div>
<div id="lightbox" aria-modal="true" role="dialog">
  <button id="lb-close" aria-label="Close">✕</button>
  <button class="lb-nav" id="lb-prev" style="left:12px" aria-label="Previous">‹</button>
  <img id="lb-img" src="" alt="">
  <div class="mt-5 text-center">
    <span id="lb-title" class="font-headline italic text-lg text-white/80 block"></span>
    <span id="lb-medium" class="font-mono text-xs tracking-widest uppercase text-white/40 block mt-1"></span>
  </div>
  <button class="lb-nav" id="lb-next" style="right:12px" aria-label="Next">›</button>
</div>
<main class="px-6 py-16 max-w-6xl mx-auto">
  <div class="flex justify-between items-center mb-16">
    <a href="../index.html" class="font-mono text-xs uppercase tracking-widest text-dim hover:text-ink transition-colors">← Back</a>
    <a href="https://www.linkedin.com/in/meredith-liu-linshu/" target="_blank" class="font-mono text-xs uppercase tracking-widest text-dim hover:text-ink transition-colors">LinkedIn</a>
  </div>

  <header class="mb-14">
    <span class="font-mono text-xs tracking-widest text-warm uppercase mb-4 block"><span class="dot mr-1"></span>Art · Ongoing always</span>
    <h1 class="font-headline text-6xl md:text-8xl font-bold tracking-tighter text-ink mb-6 leading-none">Studio</h1>
    <p class="font-body text-lg text-muted max-w-xl leading-relaxed">
      Not a professional practice, just a serious one. Oil paintings, charcoal and pencil drawings,
      mixed-media pieces, and the occasional riff on a painter I love.
    </p>
  </header>
  <div class="flex flex-wrap gap-2 mb-10" role="group" aria-label="Filter by medium">
    <button class="filter-btn on" data-f="all">All</button>
    <button class="filter-btn" data-f="painting">Painting</button>
    <button class="filter-btn" data-f="drawing">Drawing</button>
    <button class="filter-btn" data-f="mixed">Mixed media</button>
    <button class="filter-btn" data-f="studio">In the studio</button>
  </div>
  <!-- To add a piece: put a web-sized image in images/web/ and copy one <figure> block. -->
  <div class="masonry" id="gallery">
    <figure class="masonry-item art-card" data-medium="painting" tabindex="0"
      data-src="../images/web/roses.jpg" data-title="Roses, after Van Gogh" data-medium-label="Oil">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/roses.jpg" alt="Roses, after Van Gogh" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Roses, after Van Gogh</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Oil</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">A study of Van Gogh’s white roses on a green ground.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="painting" tabindex="0"
      data-src="../images/web/drippy_portrait.jpg" data-title="Drip" data-medium-label="Oil">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/drippy_portrait.jpg" alt="Drip" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Drip</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Oil</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">Expressive portrait study, letting the paint run.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="painting" tabindex="0"
      data-src="../images/web/floral_still.jpg" data-title="Bouquet with Pink Cloth" data-medium-label="Oil">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/floral_still.jpg" alt="Bouquet with Pink Cloth" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Bouquet with Pink Cloth</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Oil</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">Still life with flowers, fruit and folded fabric.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="painting" tabindex="0"
      data-src="../images/web/irises_ear.jpg" data-title="Irises, with an Ear" data-medium-label="Oil">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/irises_ear.jpg" alt="Irises, with an Ear" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Irises, with an Ear</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Oil</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">A play on Van Gogh’s Irises — and his ear.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="drawing" tabindex="0"
      data-src="../images/web/hands_sketch.jpg" data-title="Hands" data-medium-label="Charcoal">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/hands_sketch.jpg" alt="Hands" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Hands</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Charcoal</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">Figure study in charcoal and graphite.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="painting" tabindex="0"
      data-src="../images/web/blue_white_vase.jpg" data-title="Blue-and-White Vase" data-medium-label="Oil">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/blue_white_vase.jpg" alt="Blue-and-White Vase" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Blue-and-White Vase</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Oil</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">Still life with a porcelain vase and oranges.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="painting" tabindex="0"
      data-src="../images/web/pearl_panels.jpg" data-title="Pearl, in Four Panels" data-medium-label="Painting">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/pearl_panels.jpg" alt="Pearl, in Four Panels" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Pearl, in Four Panels</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Painting</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">Girl with a Pearl Earring, reworked across four panels.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="mixed" tabindex="0"
      data-src="../images/web/ski_frame.jpg" data-title="Ski Day" data-medium-label="Mixed media">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/ski_frame.jpg" alt="Ski Day" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Ski Day</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Mixed media</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">Textured snow slope with tiny skiers, in an ornate frame.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="mixed" tabindex="0"
      data-src="../images/web/ski_frame_close.jpg" data-title="Ski Day (detail)" data-medium-label="Mixed media">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/ski_frame_close.jpg" alt="Ski Day (detail)" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Ski Day (detail)</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Mixed media</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">Close-up of the slope.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="drawing" tabindex="0"
      data-src="../images/web/wall_drawings.jpg" data-title="Studio Wall: Drawings" data-medium-label="Pencil · Charcoal">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/wall_drawings.jpg" alt="Studio Wall: Drawings" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Studio Wall: Drawings</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Pencil · Charcoal</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">Portrait and figure sketches.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="studio" tabindex="0"
      data-src="../images/web/wall_paintings.jpg" data-title="Studio Wall: Paintings" data-medium-label="Oil">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/wall_paintings.jpg" alt="Studio Wall: Paintings" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Studio Wall: Paintings</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Oil</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">Work in progress, pinned up.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="studio" tabindex="0"
      data-src="../images/web/roses_easel.jpg" data-title="On the Easel" data-medium-label="Studio">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/roses_easel.jpg" alt="On the Easel" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">On the Easel</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Studio</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">The roses mid-way.</p>
      </figcaption>
    </figure>
    <figure class="masonry-item art-card" data-medium="studio" tabindex="0"
      data-src="../images/web/wall_lamp.jpg" data-title="Studio, Evening" data-medium-label="Studio">
      <div class="relative overflow-hidden border border-black/6 bg-sand2">
        <img src="../images/web/wall_lamp.jpg" alt="Studio, Evening" loading="lazy" class="w-full block">
      </div>
      <figcaption class="pt-3 pb-1">
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="font-headline text-lg font-bold text-ink leading-tight">Studio, Evening</h3>
          <span class="font-mono text-xs text-dim uppercase tracking-wide flex-shrink-0">Studio</span>
        </div>
        <p class="font-body text-sm text-muted mt-1 leading-relaxed">The wall under a sunset lamp.</p>
      </figcaption>
    </figure>
  </div>
</main>
<footer class="border-t border-black/8 px-6 py-10 mt-4">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <span class="font-headline italic text-xl text-muted">Meredith Liu</span>
    <a href="../index.html" class="font-mono text-xs uppercase tracking-widest text-dim hover:text-ink transition-colors">Home →</a>
  </div>
</footer>
<script>
const cards=[...document.querySelectorAll('.art-card')];
let vis=cards, idx=0;
document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  cards.forEach(c=>c.classList.toggle('hidden-item',b.dataset.f!=='all'&&c.dataset.medium!==b.dataset.f));
  vis=cards.filter(c=>!c.classList.contains('hidden-item'));
});
const lb=document.getElementById('lightbox'),img=document.getElementById('lb-img');
function show(i){idx=(i+vis.length)%vis.length;const c=vis[idx];img.src=c.dataset.src;img.alt=c.dataset.title;
  document.getElementById('lb-title').textContent=c.dataset.title;document.getElementById('lb-medium').textContent=c.dataset.mediumLabel;lb.classList.add('open');}
cards.forEach(c=>{c.onclick=()=>show(vis.indexOf(c));c.onkeydown=e=>{if(e.key==='Enter')show(vis.indexOf(c));};});
document.getElementById('lb-close').onclick=()=>lb.classList.remove('open');
document.getElementById('lb-prev').onclick=e=>{e.stopPropagation();show(idx-1);};
document.getElementById('lb-next').onclick=e=>{e.stopPropagation();show(idx+1);};
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open');};
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowRight')show(idx+1);if(e.key==='ArrowLeft')show(idx-1);});
</script>
</body>
</html>
